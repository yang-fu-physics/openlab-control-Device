id = "labview_dll_example"
name = "LabVIEW DLL Example Controller"
version = "0.1.0"
api_version = "4"
core_requires = ">=0.20,<0.21"
backend = "backend:LabVIEWSystemInstrument"
kinds = ["temperature"]

[[config_fields]]
id = "visa_timeout_ms"
label = "VISA I/O Timeout (ms)"
type = "integer"
default = 1000
min = 1
max = 9999

[discovery]
identity_pattern = "^REPLACE_WITH_EXACT_IDENTITY_PATTERN$"

[[controls]]
id = "main"
label = "Main Control"

[[panels]]
id = "control"
label = "Control"
template = "controller"
control = "main"
reading_options = ["value"]
default_reading = "value"
min_value = 2.0
max_value = 400.0
default_rate_per_minute = 1.0
max_rate_per_minute = 10.0
stability_tolerance = 0.05
stability_max_slope_per_minute = 0.03
stability_dwell_seconds = 5.0
stability_timeout_seconds = 1800.0
stability_window_seconds = 5.0

[readings.value]
label = "Value"
unit = "K"
decimals = 3
