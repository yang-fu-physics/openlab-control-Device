id = "zlan_6408_compressor"
name = "ZLAN 6408 Compressor I/O"
version = "0.2.0"
api_version = "4"
core_requires = ">=0.19,<0.21"
backend = "backend:Zlan6408Compressor"
kinds = ["monitor"]

[[config_fields]]
id = "host"
label = "Host"
type = "string"
default = ""

[[config_fields]]
id = "port"
label = "Port"
type = "integer"
default = 502
min = 1
max = 65535

[[config_fields]]
id = "io_timeout_seconds"
label = "I/O Timeout (s)"
type = "number"
default = 1.0
min = 0.001

[[config_fields]]
id = "unit_id"
label = "Modbus Unit ID"
type = "integer"
default = 1
min = 1
max = 247

[[panels]]
id = "compressor"
label = "Compressor"
template = "switch"
reading = "compressor_state"
commands = ["compressor_on", "compressor_off"]

[readings.compressor_state]
label = "Compressor State (DI1)"

[[sequence_commands]]
id = "compressor_on"
label = "Compressor On"

[[sequence_commands]]
id = "compressor_off"
label = "Compressor Off"
