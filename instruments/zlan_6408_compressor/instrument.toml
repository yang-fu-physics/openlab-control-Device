id = "zlan_6408_compressor"
name = "ZLAN Compressor I/O"
version = "0.2.0"
api_version = "4"
core_requires = ">=0.19,<0.21"
backend = "backend:ZlanRelayController"
kinds = ["monitor"]

[[config_fields]]
id = "host"
label = "Host"
type = "string"
default = ""

[[config_fields]]
id = "port"
label = "Port"
type = "integer"
default = 502
min = 1
max = 65535

[[config_fields]]
id = "io_timeout_seconds"
label = "I/O Timeout (s)"
type = "number"
default = 0.5
min = 0.1

[[config_fields]]
id = "unit_id"
label = "Modbus Unit ID"
type = "integer"
default = 1
min = 1
max = 247

[[config_fields]]
id = "output_count"
label = "Relay Channels (4: 6408I, 8: 6842)"
type = "choice"
default = "4"
options = ["4", "8"]

[[config_fields]]
id = "on_channels"
label = "Compressor On Steps"
type = "ordered_choices"
default = []
options = ["DO1", "DO2", "DO3", "DO4", "DO5", "DO6", "DO7", "DO8"]
option_count_from = "output_count"

[[config_fields]]
id = "off_channels"
label = "Compressor Off Steps"
type = "ordered_choices"
default = []
options = ["DO1", "DO2", "DO3", "DO4", "DO5", "DO6", "DO7", "DO8"]
option_count_from = "output_count"

[[config_fields]]
id = "step_delay_seconds"
label = "Delay Between Steps (s)"
type = "number"
default = 0.0
min = 0.0
max = 9.0

[[panels]]
id = "compressor"
label = "Compressor Relays"
template = "switch"
reading = "compressor_state"
commands = ["compressor_on", "compressor_off"]

[readings.compressor_state]
label = "Relay Output State (not compressor feedback)"

[[sequence_commands]]
id = "compressor_on"
label = "Compressor On"

[[sequence_commands]]
id = "compressor_off"
label = "Compressor Off"
