id = "cryocon_22c_24c"
name = "Cryo-con 22C / 24C Temperature Controller"
version = "0.2.0"
api_version = "3"
core_requires = ">=0.18,<0.19"
backend = "backend:Cryocon22C24CController"
kinds = ["temperature"]
dependencies = []
main_reading = "temp_b"

[panel]
template = "controller"

[discovery]
identity_pattern = "(?i)cryo-?con.*(?:22c|24c)"

[readings.temp_b]
label = "Sample Temperature (Temp B)"
unit = "K"
decimals = 3

[readings.temp_a]
label = "Cold Head Temperature (Temp A)"
unit = "K"
decimals = 3

[readings.heater_output]
label = "Heater Output"
unit = "%FS"
decimals = 2

[readings.heater_range]
label = "Heater Range"
